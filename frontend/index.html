<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CHASHKA — спеціальна кав'ярня в Ель-Кампельо, Валенсія. Ретельно відібрана кава зі всього світу, приготовлена з любов'ю."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f5ede8" />
    <!-- TODO: замінити домен перед деплоєм або встановити VITE_SITE_URL у .env -->
    <link rel="canonical" href="https://chashka.cafe/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CHASHKA Coffee Shop" />
    <meta property="og:title" content="CHASHKA | Speciality Coffee Shop" />
    <meta
      property="og:description"
      content="CHASHKA — спеціальна кав'ярня в Ель-Кампельо, Валенсія. Ретельно відібрана кава зі всього світу, приготовлена з любов'ю."
    />
    <meta property="og:url" content="https://chashka.cafe/" />
    <meta property="og:image" content="https://chashka.cafe/images/logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CHASHKA | Speciality Coffee Shop" />
    <meta
      name="twitter:description"
      content="CHASHKA — спеціальна кав'ярня в Ель-Кампельо, Валенсія."
    />
    <meta name="twitter:image" content="https://chashka.cafe/images/logo.png" />

    <!-- Structured Data: LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CafeOrCoffeeShop",
      "name": "CHASHKA Coffee Shop",
      "description": "Спеціальна кав'ярня в Ель-Кампельо, Валенсія. Ретельно відібрана кава зі всього світу.",
      "url": "https://chashka.cafe",
      "logo": "https://chashka.cafe/images/logo.png",
      "image": "https://chashka.cafe/images/logo.png",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Sant Bartolomé 122",
        "addressLocality": "El Campello",
        "addressRegion": "Valencia",
        "addressCountry": "ES"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "38.4389",
        "longitude": "-0.3948"
      },
      "servesCuisine": ["Coffee", "Specialty Coffee"],
      "priceRange": "€€",
      "sameAs": [
        "https://instagram.com/chashka.elcampello"
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <title>CHASHKA | Speciality Coffee Shop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
